<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计签名封装 · 信封看板</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#26304a; --fg:#e6ebf5;
    --muted:#8a96b0; --ok:#36c46f; --bad:#e0564f; --warn:#e0a93f;
    --accent:#5b8def; --chip:#222c44; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:16px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  .muted { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:6px; padding:10px 22px 0; }
  .tabs button { background:none; border:1px solid transparent; color:var(--muted);
    padding:7px 14px; border-radius:8px 8px 0 0; cursor:pointer; font-size:13px; }
  .tabs button.on { color:var(--fg); background:var(--panel); border-color:var(--line);
    border-bottom-color:var(--panel); }
  main { padding:18px 22px 60px; }
  .pane { display:none; } .pane.on { display:block; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  .chip { background:var(--chip); border-radius:20px; padding:2px 10px; font-size:12px;
    color:#bcc8e2; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .bg-ok { background:var(--ok); } .bg-bad { background:var(--bad); } .bg-warn{background:var(--warn);}
  button.act { background:var(--accent); border:0; color:#fff; padding:6px 12px;
    border-radius:7px; cursor:pointer; font-size:12.5px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg);
    padding:5px 11px; border-radius:7px; cursor:pointer; font-size:12.5px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line);
    vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  code { background:#101627; padding:1px 5px; border-radius:4px; }
  .problems { background:#2a1a1c; border:1px solid #4a2b2c; border-radius:8px;
    padding:8px 10px; margin-top:8px; }
  .bar { height:8px; background:#101627; border-radius:5px; overflow:hidden; width:160px; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .lineage { margin-left:14px; border-left:2px solid var(--line); padding-left:14px;
    margin-top:8px; }
  pre { white-space:pre-wrap; word-break:break-all; margin:6px 0 0;
    max-height:240px; overflow:auto; }
  .sigline { display:flex; gap:8px; align-items:center; margin:3px 0; }
</style>
</head>
<body>
<header>
  <h1>设计签名封装服务</h1>
  <span id="health" class="muted">加载中…</span>
  <span style="flex:1"></span>
  <button class="ghost" onclick="loadAll()">刷新</button>
  <a class="ghost" style="text-decoration:none" href="/api/envelopes" target="_blank">JSON</a>
</header>
<div class="tabs">
  <button data-pane="envelopes" class="on" onclick="showPane('envelopes')">信封与谱系</button>
  <button data-pane="assemblies" onclick="showPane('assemblies')">组装 / 分块上传</button>
  <button data-pane="signers" onclick="showPane('signers')">签名者与密钥</button>
  <button data-pane="audit" onclick="showPane('audit')">审计留痕</button>
</div>
<main>
  <section id="pane-envelopes" class="pane on"><div id="env-list"></div></section>
  <section id="pane-assemblies" class="pane"><div id="asm-list"></div></section>
  <section id="pane-signers" class="pane"><div id="signer-list"></div></section>
  <section id="pane-audit" class="pane"><div class="card"><div id="audit-list"></div></div></section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
